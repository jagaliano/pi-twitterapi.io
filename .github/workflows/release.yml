# Publishes a tagged release to npm and opens the matching GitHub release.
#
# Runs automatically on a v* tag push, or on demand against an existing tag:
#
#   gh workflow run release.yml --ref v0.1.0
#     dry run: checks the token and the whole pipeline, publishes nothing
#
#   gh workflow run release.yml --ref v0.1.0 -f publish=true
#     the real publish
#
# Authentication: set a repository secret named NPM_TOKEN holding an npm
# granular access token (npmjs.com -> Access Tokens -> Generate New Token,
# "Read and write (publish and stage)" + "Bypass two-factor authentication")
# so the publish can run unattended. Without the secret the run continues and
# prints a note instead of verifying a token; publishing then relies on npm
# trusted publishing (OIDC) once a trusted publisher is configured.
#
# A manual run must target a tag: workflow_dispatch uses the workflow as it
# exists at that ref, so the ref has to contain the revision you want to run.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Publish to npm. Off = dry run that checks the token and the
          pipeline without publishing.
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "release.yml must run from a tag ref, e.g." >&2
            echo "  gh workflow run release.yml --ref v0.1.0" >&2
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json $version" >&2
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify npm authentication
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "No NPM_TOKEN secret set; skipping the token check."
            echo "Publishing needs a granular token secret or OIDC trust."
            exit 0
          fi
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
          else
            gh release create "$tag" --generate-notes --title "$tag"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
