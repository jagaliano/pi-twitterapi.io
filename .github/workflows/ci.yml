name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify the published tarball ships the pi manifest entry
        run: |
          tarball=$(npm pack --silent)
          tar -tzf "$tarball" > /tmp/files.txt
          cat /tmp/files.txt
          grep -q '^package/package.json$' /tmp/files.txt
          grep -q '^package/src/index.ts$' /tmp/files.txt
          grep -q '^package/README.md$' /tmp/files.txt
          if grep -q '\.test\.ts$' /tmp/files.txt; then
            echo "test files must not be published" >&2
            exit 1
          fi
          rm -f "$tarball"
