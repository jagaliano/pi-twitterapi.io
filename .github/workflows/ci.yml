name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `lts/*` is what most users run; the engines floor is 22.19 and the
        # extension must keep working on it.
        node-version: ["lts/*", "22.19"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 12

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The frame-timing test (V1) drives the real ffmpeg and skips itself when the
      # binary is missing, so without this the one test that catches wrong frame
      # labels would never run in CI. whisper.cpp tests stay local-only: the model
      # is ~500 MB.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify the published tarball ships the pi manifest entry
        run: |
          tarball=$(npm pack --silent)
          tar -tzf "$tarball" > /tmp/files.txt
          cat /tmp/files.txt
          grep -q '^package/package.json$' /tmp/files.txt
          grep -q '^package/src/index.ts$' /tmp/files.txt
          grep -q '^package/README.md$' /tmp/files.txt
          if grep -q '\.test\.ts$' /tmp/files.txt; then
            echo "test files must not be published" >&2
            exit 1
          fi
          rm -f "$tarball"
